[project]
name = "cloudbus-pass"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "S101",  # assert is how pytest works
    "S311",  # `random` only generates demo seed data
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"buspass/seed.py" = ["S105"]
"locustfile.py" = ["S105"]  # public demo password
"buspass/config.py" = ["S105"]
"buspass/services/sponsors.py" = ["S105", "S107"]  # "pass_type" is not a password

[tool.ruff.lint.isort]
known-first-party = ["buspass"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:buspass.*"]
