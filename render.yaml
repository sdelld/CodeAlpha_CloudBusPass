# Render Blueprint: New > Blueprint > pick this repo. Creates the database and the web service (free plans).
databases:
  - name: buspass-db
    plan: free
    databaseName: buspass
    user: buspass

services:
  - type: web
    name: codealpha-buspass
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: buspass-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: MOCK_WEBHOOK_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      # Demo deployment: seeds demo data, shows OTP codes on screen, uses the test checkout.
      # For a real launch set DEMO_MODE=0 and PAYMENT_PROVIDER=stripe|paymob|fawry with real keys.
      - key: DEMO_MODE
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
