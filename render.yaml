# Render Blueprint: New > Blueprint > pick this repo. Creates the database and the web service.
databases:
  - name: buspass-db
    plan: free
    databaseName: buspass
    user: buspass

services:
  - type: web
    name: codealpha-buspass
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: buspass-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CONDUCTOR_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
