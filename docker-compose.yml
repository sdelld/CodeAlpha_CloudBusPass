# Local copy of the cloud architecture: load balancer -> N app servers -> PostgreSQL (+ Redis for rate limits).
#   cp .env.example .env      # then edit secrets
#   docker compose up --build
#   docker compose up -d --scale app=5     # scale the app tier while it runs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buspass
      POSTGRES_PASSWORD: buspass
      POSTGRES_DB: buspass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buspass"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://buspass:buspass@db:5432/buspass
      RATELIMIT_STORAGE_URI: redis://redis:6379
      DEMO_MODE: ${DEMO_MODE:-1}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-0123456789abcdef}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - uploads:/app/instance/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      replicas: 3

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
