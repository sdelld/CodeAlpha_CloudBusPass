{% extends "base.html" %}
{% block content %}
<div class="panel narrow">
  <h1>Book a ticket</h1>
  <form method="post" id="book-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="idempotency_key" value="{{ idempotency_key }}">
    <label>Route
      <select name="route_id" id="route" required>
        {% for r in routes %}
          <option value="{{ r.id }}" {{ 'selected' if r.id == selected }}>{{ r.code }} · {{ r.origin }} → {{ r.destination }} ({{ r.departure_time }})</option>
        {% endfor %}
      </select>
    </label>
    <label>Ticket type
      <select name="pass_type" id="pass_type">
        {% for key, p in PASS_TYPES.items() %}<option value="{{ key }}">{{ p.label }}</option>{% endfor %}
      </select>
    </label>
    <label>Travel date / pass start
      <input type="date" name="travel_date" id="travel_date" required value="{{ today }}" min="{{ today }}" max="{{ max_day }}">
    </label>
    <div class="quote" id="quote" aria-live="polite">Price: …</div>
    <p class="muted small">Payment is simulated in this demo. The price shown comes from the server and is re-calculated when you confirm.</p>
    <button class="btn" id="submit">Confirm booking</button>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
  const f = document.getElementById('book-form'), q = document.getElementById('quote');
  async function refresh() {
    const p = new URLSearchParams({route_id: f.route_id.value, pass_type: f.pass_type.value, date: f.travel_date.value});
    try {
      const r = await fetch('/api/quote?' + p); const d = await r.json();
      q.textContent = 'Price: ' + d.display + (d.seats_left !== null ? ` · ${d.seats_left} seats left` : '');
    } catch { q.textContent = 'Price: unavailable'; }
  }
  f.addEventListener('change', refresh); refresh();
  // Prevent double submits; the idempotency key also protects against this server-side.
  f.addEventListener('submit', () => { document.getElementById('submit').disabled = true; });
</script>
{% endblock %}
