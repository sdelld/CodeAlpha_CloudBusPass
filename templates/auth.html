{% extends "base.html" %}
{% block content %}
<div class="panel narrow">
  <h1>{{ 'Create an account' if mode == 'register' else 'Log in' }}</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if mode == 'register' %}
      <label>Full name <input name="name" required autocomplete="name"></label>
    {% endif %}
    <label>Email <input name="email" type="email" required autocomplete="email"></label>
    <label>Password <input name="password" type="password" required minlength="8"
      autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}"></label>
    <button class="btn">{{ 'Sign up' if mode == 'register' else 'Log in' }}</button>
  </form>
  {% if mode == 'register' %}
    <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  {% else %}
    <p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  {% endif %}
</div>
{% endblock %}
